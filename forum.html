<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>LUMEN DATA LEAK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        *:focus {
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            perspective: 1000px;
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        .header-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .title-box {
            background: linear-gradient(145deg, rgba(25, 25, 40, 0.95) 0%, rgba(15, 15, 25, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px 50px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        .title-text {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(25, 25, 40, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background: rgba(35, 35, 50, 0.95);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-container {
            background: linear-gradient(145deg, rgba(25, 25, 40, 0.95) 0%, rgba(15, 15, 25, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .file-input-label {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px dashed rgba(0, 255, 0, 0.4);
            border-radius: 12px;
            color: #00ff00;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            background: rgba(0, 255, 0, 0.2);
            border-color: rgba(0, 255, 0, 0.6);
            transform: translateY(-2px);
        }

        .file-input-label.loaded {
            background: rgba(0, 255, 0, 0.15);
            border-color: rgba(0, 255, 0, 0.5);
            border-style: solid;
        }

        .file-input-label.drag-over {
            background: rgba(0, 255, 0, 0.3);
            border-color: rgba(0, 255, 0, 0.8);
            transform: scale(1.02);
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .accounts-list {
            background: linear-gradient(145deg, rgba(25, 25, 40, 0.95) 0%, rgba(15, 15, 25, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            overflow-y: auto;
        }

        .accounts-list::-webkit-scrollbar {
            width: 8px;
        }

        .accounts-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .accounts-list::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 0, 0.3);
            border-radius: 10px;
        }

        .accounts-list::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 0, 0.5);
        }

        .account-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            word-break: break-all;
            cursor: pointer;
        }

        .account-item:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(0, 255, 0, 0.4);
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .account-item:last-child {
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        .stats {
            background: linear-gradient(145deg, rgba(25, 25, 40, 0.95) 0%, rgba(15, 15, 25, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .stat-value {
            color: #00ff00;
            font-weight: 700;
            font-size: 18px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-button {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .page-button:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(0, 255, 0, 0.4);
        }

        .page-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-button.active {
            background: rgba(0, 255, 0, 0.2);
            border-color: rgba(0, 255, 0, 0.5);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title-text {
                font-size: 28px;
                letter-spacing: 4px;
            }

            .title-box {
                padding: 20px 30px;
            }

            .back-button {
                top: 10px;
                left: 10px;
                padding: 10px 18px;
                font-size: 12px;
            }

            .accounts-list {
                max-height: 60vh;
            }

            .account-item {
                font-size: 12px;
                padding: 12px 15px;
            }

            .stats {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <a href="index.html" class="back-button">← Back</a>

    <div class="header-container">
        <div class="title-box">
            <div class="title-text">L U M E N D A T A L E A K</div>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-item">
                Total Accounts: <span class="stat-value" id="totalAccounts">0</span>
            </div>
            <div class="stat-item">
                Displayed: <span class="stat-value" id="displayedAccounts">0</span>
            </div>
            <div class="stat-item">
                Page: <span class="stat-value" id="currentPage">1</span>
            </div>
        </div>

        <div class="search-container">
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
            <label for="fileInput" class="file-input-label" id="fileInputLabel">
                📁 Load acc.txt File
            </label>
            <input type="text" class="search-input" id="searchInput" placeholder="Search accounts..." style="margin-top: 15px;">
        </div>

        <div class="accounts-list" id="accountsList">
            <div class="loading">Loading accounts...</div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        // Matrix Rain Effect
        const matrixCanvas = document.getElementById('matrix-canvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        
        const matrixChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const matrixCharsArray = matrixChars.split('');
        const isMobileDevice = window.innerWidth <= 768;
        const matrixFontSize = isMobileDevice ? 20 : 16;
        
        let matrixDrops = [];
        
        function resizeMatrixCanvas() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const isMobileDeviceResize = window.innerWidth <= 768;
            const newFontSize = isMobileDeviceResize ? 20 : 16;
            const newColumns = Math.floor(matrixCanvas.width / newFontSize);
            
            while (matrixDrops.length < newColumns) {
                matrixDrops.push(Math.random() * -100);
            }
            while (matrixDrops.length > newColumns) {
                matrixDrops.pop();
            }
        }
        
        resizeMatrixCanvas();
        window.addEventListener('resize', resizeMatrixCanvas);

        function drawMatrixRain() {
            matrixCtx.fillStyle = 'rgba(10, 10, 10, 0.04)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            
            const isMobileDevice = window.innerWidth <= 768;
            const currentFontSize = isMobileDevice ? 20 : 16;
            matrixCtx.font = currentFontSize + 'px monospace';
            
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = matrixCharsArray[Math.floor(Math.random() * matrixCharsArray.length)];
                const x = i * currentFontSize;
                const y = matrixDrops[i] * currentFontSize;
                
                const opacity = Math.random() * 0.5 + 0.3;
                matrixCtx.fillStyle = `rgba(0, 255, 0, ${opacity})`;
                matrixCtx.fillText(text, x, y);
                
                if (y > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        function animateMatrix() {
            drawMatrixRain();
            requestAnimationFrame(animateMatrix);
        }

        animateMatrix();

        // Account loading and display
        let allAccounts = [];
        let filteredAccounts = [];
        let currentPage = 1;
        const accountsPerPage = 100;

        function processAccounts(text, fileName = 'acc.txt') {
            try {
                allAccounts = text.split('\n').filter(line => line.trim() !== '');
                filteredAccounts = [...allAccounts];
                
                document.getElementById('totalAccounts').textContent = allAccounts.length.toLocaleString();
                const fileLabel = document.getElementById('fileInputLabel');
                fileLabel.textContent = `✓ Loaded: ${fileName} (${allAccounts.length.toLocaleString()} accounts)`;
                fileLabel.classList.add('loaded');
                fileLabel.style.cursor = 'default';
                
                displayAccounts();
                setupPagination();
            } catch (error) {
                console.error('Error parsing file:', error);
                document.getElementById('accountsList').innerHTML = 
                    '<div class="loading" style="color: #ff0000;">Error parsing file. Please check the file format.</div>';
            }
        }

        function loadAccountsFromFile(file) {
            const reader = new FileReader();
            const fileLabel = document.getElementById('fileInputLabel');
            
            fileLabel.textContent = '⏳ Loading file...';
            fileLabel.style.cursor = 'wait';
            
            reader.onload = function(e) {
                processAccounts(e.target.result, file.name);
            };
            
            reader.onerror = function() {
                console.error('Error reading file');
                document.getElementById('accountsList').innerHTML = 
                    '<div class="loading" style="color: #ff0000;">Error reading file. Please try again.</div>';
                fileLabel.textContent = '📁 Load acc.txt File';
                fileLabel.style.cursor = 'pointer';
            };
            
            // Read file as text
            reader.readAsText(file);
        }

        // Try to load acc.txt automatically
        async function autoLoadAccounts() {
            const fileLabel = document.getElementById('fileInputLabel');
            const accountsList = document.getElementById('accountsList');
            
            fileLabel.textContent = '⏳ Loading acc.txt...';
            fileLabel.style.cursor = 'wait';
            accountsList.innerHTML = '<div class="loading">⏳ Loading accounts from acc.txt...</div>';
            
            try {
                // Try to load via fetch (works with local server)
                const response = await fetch('acc.txt', {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/plain'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                
                if (!text || text.trim().length === 0) {
                    throw new Error('File is empty');
                }
                
                processAccounts(text, 'acc.txt');
            } catch (error) {
                // If fetch fails (CORS or other error), show file input
                console.log('Auto-load failed:', error);
                fileLabel.textContent = '📁 Load acc.txt File (Click to select or drag & drop)';
                fileLabel.style.cursor = 'pointer';
                accountsList.innerHTML = 
                    '<div class="loading">⚠️ Auto-load failed. Please select acc.txt file manually.<br><small style="color: rgba(255,255,255,0.5); margin-top: 10px; display: block;">Tip: Open via local server (e.g., python -m http.server) for auto-load</small></div>';
            }
        }

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                loadAccountsFromFile(file);
            }
        });

        // Drag and drop functionality
        const fileLabel = document.getElementById('fileInputLabel');
        const searchContainer = document.querySelector('.search-container');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            searchContainer.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            searchContainer.addEventListener(eventName, () => {
                fileLabel.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            searchContainer.addEventListener(eventName, () => {
                fileLabel.classList.remove('drag-over');
            }, false);
        });

        searchContainer.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                loadAccountsFromFile(files[0]);
            }
        }, false);

        function displayAccounts() {
            const listContainer = document.getElementById('accountsList');
            const startIndex = (currentPage - 1) * accountsPerPage;
            const endIndex = startIndex + accountsPerPage;
            const accountsToShow = filteredAccounts.slice(startIndex, endIndex);

            if (accountsToShow.length === 0) {
                listContainer.innerHTML = '<div class="loading">No accounts found</div>';
                return;
            }

            listContainer.innerHTML = accountsToShow.map(account => 
                `<div class="account-item">${escapeHtml(account)}</div>`
            ).join('');

            document.getElementById('displayedAccounts').textContent = 
                `${startIndex + 1}-${Math.min(endIndex, filteredAccounts.length)}`;
            document.getElementById('currentPage').textContent = currentPage;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setupPagination() {
            const totalPages = Math.ceil(filteredAccounts.length / accountsPerPage);
            const paginationContainer = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHTML = '';

            // Previous button
            paginationHTML += `<button class="page-button" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">Previous</button>`;

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationHTML += `<button class="page-button" onclick="goToPage(1)">1</button>`;
                if (startPage > 2) {
                    paginationHTML += `<span style="color: rgba(255,255,255,0.5); padding: 0 10px;">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `<button class="page-button ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span style="color: rgba(255,255,255,0.5); padding: 0 10px;">...</span>`;
                }
                paginationHTML += `<button class="page-button" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            paginationHTML += `<button class="page-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next</button>`;

            paginationContainer.innerHTML = paginationHTML;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredAccounts.length / accountsPerPage);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            displayAccounts();
            setupPagination();
            
            // Scroll to top of list
            document.getElementById('accountsList').scrollTop = 0;
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    filteredAccounts = [...allAccounts];
                } else {
                    filteredAccounts = allAccounts.filter(account => 
                        account.toLowerCase().includes(searchTerm)
                    );
                }
                
                currentPage = 1;
                displayAccounts();
                setupPagination();
            }, 300);
        });

        // Copy account on click
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('account-item')) {
                const accountText = e.target.textContent;
                navigator.clipboard.writeText(accountText).then(() => {
                    e.target.style.background = 'rgba(0, 255, 0, 0.2)';
                    setTimeout(() => {
                        e.target.style.background = '';
                    }, 500);
                });
            }
        });

        // Auto-load accounts on page load
        autoLoadAccounts();
    </script>
</body>
</html>
